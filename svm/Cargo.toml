[package]
name = "quasar-svm"
version = "0.1.0"
edition = "2021"
authors = ["Blueshift <xblueshift.gg>"]
description = "Lightweight Solana virtual machine for local transaction execution"
license = "MIT"
repository = "https://github.com/blueshift-gg/quasar-svm"
homepage = "https://github.com/blueshift-gg/quasar-svm"
documentation = "https://docs.rs/quasar-svm"
keywords = ["solana", "svm", "blockchain", "virtual-machine"]
categories = ["development-tools", "emulators"]
readme = "README.md"
include = [
    "src/**/*",
    "programs/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE"
]

[dependencies]
# Core SVM execution
agave-feature-set = { version = "4.1", features = ["agave-unstable-api"] }
solana-syscalls = { version = "4.1", features = ["agave-unstable-api"] }
solana-bpf-loader-program = { version = "4.1", features = ["agave-unstable-api"] }
solana-program-runtime = { version = "4.1", features = ["metrics"] }
solana-system-program = { version = "4.1", features = ["agave-unstable-api"] }
solana-transaction-context = { version = "4.1", features = ["dev-context-only-utils"] }

# Types
solana-account = "4.3"
solana-clock = "3.0"
solana-compute-budget = { version = "4.1", features = ["agave-unstable-api"] }
solana-epoch-rewards = "3.0"
solana-epoch-schedule = "3.0"
solana-hash = "3.1"
solana-instruction = "3.0"
solana-instruction-error = "2.0"
solana-instructions-sysvar = "3.0"
solana-loader-v3-interface = { version = "7.0", features = ["serde"] }
solana-message = "4.1"
solana-precompile-error = "3.0"
solana-pubkey = "4.0"
solana-rent = "4.2"
solana-sdk-ids = "3.0"
solana-slot-hashes = "3.0"
solana-stake-interface = "3.1"
solana-svm-callback = "4.1"
solana-svm-log-collector = "4.1"
solana-svm-timings = "4.1"
solana-svm-transaction = "4.1"
solana-sysvar = "4.0"
solana-sysvar-id = "3.0"
solana-transaction-error = "3.0"

bincode = "1.3"
borsh = { version = "1", optional = true }
spl-token = { version = "9.0.0", default-features = false, features = ["no-entrypoint"] }
solana-program-pack = "3.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
borsh = ["dep:borsh"]

[[bench]]
name = "svm_bench"
harness = false
